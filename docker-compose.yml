services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: minha_rotina
      POSTGRES_PASSWORD: minha_rotina
      POSTGRES_DB: minha_rotina
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minha_rotina -d minha_rotina"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
