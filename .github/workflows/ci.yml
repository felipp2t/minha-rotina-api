name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://minha_rotina:minha_rotina@localhost:5432/minha_rotina

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minha_rotina
          POSTGRES_PASSWORD: minha_rotina
          POSTGRES_DB: minha_rotina
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minha_rotina -d minha_rotina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Lint
        run: pnpm run lint

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check OpenAPI specification
        run: |
          pnpm openapi
          git diff --exit-code -- openapi.json
